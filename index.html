// ============= STORAGE =============
const STORAGE_PREFIX = "quetes_anomalies_game_";
const GAMES_LIST_KEY = "quetes_anomalies_games_list";

function saveGame(gameId, gameData) {
  try {
    localStorage.setItem(STORAGE_PREFIX + gameId, JSON.stringify(gameData));
    updateGamesList(gameId, gameData);
  } catch (error) { console.error("Erreur sauvegarde:", error); }
}

function loadGame(gameId) {
  try {
    const data = localStorage.getItem(STORAGE_PREFIX + gameId);
    return data ? JSON.parse(data) : null;
  } catch (error) { return null; }
}

function updateGamesList(gameId, gameData) {
  try {
    const list = getGamesList();
    const existingIndex = list.findIndex(g => g.id === gameId);
    const gameInfo = {
      id: gameId,
      name: `Partie ${gameData.playerCount} joueurs`,
      playerCount: gameData.playerCount,
      players: gameData.players.map(p => p.playerName),
      lastUpdate: Date.now(),
      step: gameData.step
    };
    if (existingIndex >= 0) list[existingIndex] = gameInfo;
    else list.push(gameInfo);
    localStorage.setItem(GAMES_LIST_KEY, JSON.stringify(list));
  } catch (error) { console.error("Erreur mise à jour liste:", error); }
}

function getGamesList() {
  try {
    const data = localStorage.getItem(GAMES_LIST_KEY);
    return data ? JSON.parse(data) : [];
  } catch (error) { return []; }
}

function deleteGame(gameId) {
  try {
    localStorage.removeItem(STORAGE_PREFIX + gameId);
    const list = getGamesList().filter(g => g.id !== gameId);
    localStorage.setItem(GAMES_LIST_KEY, JSON.stringify(list));
  } catch (error) { console.error("Erreur suppression:", error); }
}

  getAttackBonus: (player, ctx) => {
    let bonus = 0;
    const details = [];
    
    // Chasseur: +1 vs monstres de quête (à distance)
    if (player.characterKey === 'CHASSEUR' && (ctx.type === 'QUEST' || ctx.isRanged)) {
      bonus += 1;
      details.push({ value: 1, source: "+1 à distance (Chasseur)" });
    }
    // Chevalier: +1 vs territoires neutres
    if (player.characterKey === 'CHEVALIER' && ctx.type === 'TERRITORY' && ctx.isNeutral) {
      bonus += 1;
      details.push({ value: 1, source: "+1 vs neutre (Chevalier)" });
    }
    
    return { bonus, details };
  },
  
  getCounterDamage: (defender) => {
    if (defender.characterKey === 'HOMME_BETE') return 1;
    return 0;
  },
  
  avoidsCounter: (attacker, ctx) => {
    if (attacker.characterKey === 'CHASSEUR' && ctx.isRanged) return true;
    return false;
  },
  
  getHealOnSuccess: (attacker) => {
    if (attacker.characterKey === 'HOMME_BETE') return 2;
    return 0;
  },
  
  getKillBonus: (attacker, defender) => {
    if (attacker.characterKey === 'HERETIQUE' && defender.effects?.some(e => e.type === 'CURSE')) return 1;
    return 0;
  },
  
  getQuestBonus: (player) => {

    return 0;

// ============= PARSING =============
function parseAnomaly(text) {
  let m;
  if (m = text.match(/Soignez (\d+)/)) return { type: 'heal', amount: +m[1] };
  if (m = text.match(/Perdez (\d+) \[Point de vie\]/)) return { type: 'damage', amount: +m[1] };
  if (m = text.match(/Bénédiction.*\[(.+?)\]/)) return { type: 'bless', stat: STAT_MAPPING[m[1]], statName: m[1] };
  if (m = text.match(/Malédiction.*\[(.+?)\]/)) return { type: 'curse', stat: STAT_MAPPING[m[1]], statName: m[1] };
  if (m = text.match(/Gagnez (\d+) \[Pièce/)) return { type: 'gain', resource: 'or', amount: +m[1] };
  if (m = text.match(/Gagnez (\d+) \[Ecorce/)) return { type: 'gain', resource: 'cuivre', amount: +m[1] };
  if (m = text.match(/Gagnez (\d+) \[Sable/)) return { type: 'gain', resource: 'argent', amount: +m[1] };
  if (m = text.match(/Gagnez (\d+) \[Roche/)) return { type: 'gain', resource: 'obsidienne', amount: +m[1] };
  if (m = text.match(/Perdez (\d+) \[Pièce/)) return { type: 'lose', resource: 'or', amount: +m[1] };
  if (m = text.match(/Perdez (\d+) \[Ecorce/)) return { type: 'lose', resource: 'cuivre', amount: +m[1] };
  if (m = text.match(/Perdez (\d+) \[Sable/)) return { type: 'lose', resource: 'argent', amount: +m[1] };
  if (m = text.match(/Perdez (\d+) \[Roche/)) return { type: 'lose', resource: 'obsidienne', amount: +m[1] };
  return { type: 'other' };
}

function parseQuest(text) {
  const pdvMatch = text.match(/(\d+) \[Point de victoire\]/);
  const pdv = pdvMatch ? +pdvMatch[1] : 0;
  
  const exchMatch = text.match(/Echanger (\d+) \[(.+?)\] contre/);
  if (exchMatch) {
    const resInfo = RESOURCE_MAPPING[exchMatch[2]];
    return { pdv, isExchange: true, isCombat: false, resourceKey: resInfo?.key, resourceAmount: +exchMatch[1] };
  }
  
  const combatMatch = text.match(/difficulté (\d+) en \[(.+?)\]/);
  if (combatMatch) {
    return { pdv, isExchange: false, isCombat: true, difficulty: +combatMatch[1], stat: STAT_MAPPING[combatMatch[2]], statName: combatMatch[2] };
  }
  
  return { pdv, isExchange: false, isCombat: false };
}

// Fonction pour obtenir une ressource aléatoire disponible
function getRandomAvailableResource(player) {
  const available = [];
  if (player.or > 0) available.push('or');
  if (player.cuivre > 0) available.push('cuivre');
  if (player.argent > 0) available.push('argent');
  if (player.obsidienne > 0) available.push('obsidienne');
  if (available.length === 0) return null;
  return available[Math.floor(Math.random() * available.length)];
}

// Fonction pour compter les territoires par biome
function countTerritoriesByBiome(territories) {
  const counts = { FORET: 0, DESERT: 0, MONTAGNE: 0 };
  (territories || []).forEach(t => {
    if (counts[t.biome] !== undefined) counts[t.biome]++;
  });
  return counts;
}

// ============= MAIN APP =============
function TurnBasedGameApp() {
  const [currentGameId, setCurrentGameId] = useState(null);
  const [gameState, setGameState] = useState(null);
  const [currentPlayerSetup, setCurrentPlayerSetup] = useState(0);

  useEffect(() => {
    if (currentGameId && gameState) saveGame(currentGameId, gameState);
  }, [gameState, currentGameId]);

  const startNewGame = () => {
    const newGameId = `game_${Date.now()}`;
    setCurrentGameId(newGameId);
    setGameState({
      step: 'setup', playerCount: 0, players: [], selectedCharacters: [],
      currentTurn: 0, drawnAnomalies: [], drawnQuetes: [],
      lastEventThreshold: 0, eventBonus: 0
    });
  };

  const loadExistingGame = (gameId) => {
    const savedGame = loadGame(gameId);
    if (savedGame) { setCurrentGameId(gameId); setGameState(savedGame); }
  };

  const backToHome = () => { setCurrentGameId(null); setGameState(null); setCurrentPlayerSetup(0); };

  if (!currentGameId || !gameState) {
    return React.createElement(HomeScreen, { onNewGame: startNewGame, onLoadGame: loadExistingGame });
  }

  const handleSetupComplete = (count) => {
    setGameState({ ...gameState, playerCount: count, step: 'select_characters', selectedCharacters: [] });
  };

  const handleCharacterSelected = (characterKey, playerName) => {
    const newPlayers = [...gameState.players];
    const character = CHARACTERS[characterKey];
    const startGold = rulesEngine.getStartGold(characterKey);
    
    newPlayers[currentPlayerSetup] = {
      id: `player_${currentPlayerSetup}`,
      playerName,
      characterKey,
      character,
      pvCurrent: character.pvMax,
      or: startGold,
      cuivre: 0,
      argent: 0,
      obsidienne: 0,
      pdv: 0,
      pdvHistory: [],
      tourPlateau: 0,
      baseStats: null,
      effects: [],
      quests: [],
      territories: [],
      skills: character.skills.map((s, idx) => ({ id: `skill_${idx}`, description: s, status: 'AVAILABLE' })),
      usedAttackDice: false,
      rerollAvailable: true,
      blessAvailable: characterKey === 'VICAIRE',
      curseAvailable: characterKey === 'HERETIQUE'
    };

    const newSelectedChars = [...gameState.selectedCharacters, characterKey];

    if (currentPlayerSetup < gameState.playerCount - 1) {
      setCurrentPlayerSetup(currentPlayerSetup + 1);
      setGameState({ ...gameState, players: newPlayers, selectedCharacters: newSelectedChars });
    } else {
      setGameState({ ...gameState, players: newPlayers, selectedCharacters: newSelectedChars, step: 'allocate_stats' });
      setCurrentPlayerSetup(0);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleStatsAllocated = (stats) => {
    const newPlayers = [...gameState.players];
    newPlayers[currentPlayerSetup].baseStats = stats;

    if (currentPlayerSetup < gameState.playerCount - 1) {
      setCurrentPlayerSetup(currentPlayerSetup + 1);
      setGameState({ ...gameState, players: newPlayers });
    } else {
      setGameState({ ...gameState, players: newPlayers, step: 'play', currentTurn: 0 });
      setCurrentPlayerSetup(0);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const updateCurrentPlayer = (updates) => {
    setGameState((prev) => {
      if (!prev) return prev;
      const newPlayers = [...prev.players];
      const idx = prev.currentTurn;
      newPlayers[idx] = { ...newPlayers[idx], ...(typeof updates === "function" ? updates(newPlayers[idx], prev) : updates) };
      return { ...prev, players: newPlayers };
    });
  };

  const updatePlayer = (playerIndex, updates) => {
    setGameState((prev) => {
      if (!prev) return prev;
      const newPlayers = [...prev.players];
      newPlayers[playerIndex] = { ...newPlayers[playerIndex], ...(typeof updates === "function" ? updates(newPlayers[playerIndex], prev) : updates) };
      return { ...prev, players: newPlayers };
    });
  };

  const addPdvWithHistory = (playerIndex, amount, source, details = {}) => {
    setGameState((prev) => {
      if (!prev) return prev;
      const newPlayers = [...prev.players];
      const player = newPlayers[playerIndex];
      const newPdv = player.pdv + amount;
      
      const historyEntry = { id: `pdv_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`, amount, source, details, timestamp: Date.now() };
      
      newPlayers[playerIndex] = { ...player, pdv: newPdv, pdvHistory: [...(player.pdvHistory || []), historyEntry] };
      
      // Calculer le total des PDV de tous les joueurs
      const oldTotalPdv = prev.players.reduce((sum, p) => sum + p.pdv, 0);
      const newTotalPdv = newPlayers.reduce((sum, p) => sum + p.pdv, 0);
      
      const oldThreshold = Math.floor(oldTotalPdv / 10);
      const newThreshold = Math.floor(newTotalPdv / 10);
      let newState = { ...prev, players: newPlayers };
      
      if (newThreshold > oldThreshold && newThreshold > (prev.lastEventThreshold || 0)) {
        const eventText = MAJOR_EVENTS[Math.floor(Math.random() * MAJOR_EVENTS.length)];
        newState.lastEventThreshold = newThreshold;
        newState.pendingEvent = { text: eventText, threshold: newThreshold * 10, totalPdv: newTotalPdv };
      }
      
      return newState;
    });
  };

  const clearPendingEvent = () => {
    setGameState(prev => ({ ...prev, pendingEvent: null }));
  };

  const nextTurn = () => {
    const newPlayers = [...gameState.players];
    const currentPlayer = newPlayers[gameState.currentTurn];
    
    // Reset des flags seulement
    currentPlayer.usedAttackDice = false;
    currentPlayer.rerollAvailable = true;
    
    const nextTurnIndex = (gameState.currentTurn + 1) % gameState.playerCount;
    
    setGameState({ 
      ...gameState, 
      players: newPlayers, 
      currentTurn: nextTurnIndex, 
      eventBonus: 0
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const resetGame = () => {
    if (confirm("Voulez-vous vraiment réinitialiser toute la partie ?")) {
      deleteGame(currentGameId);
      backToHome();
    }
  };

  if (gameState.step === 'setup') {
    return React.createElement(SetupScreen, { onComplete: handleSetupComplete });
  }

  if (gameState.step === 'select_characters') {
    return React.createElement(CharacterSelectScreen, {
      playerNumber: currentPlayerSetup + 1,
      totalPlayers: gameState.playerCount,
      selectedCharacters: gameState.selectedCharacters,
      onCharacterSelected: handleCharacterSelected
    });
  }

  if (gameState.step === 'allocate_stats') {
    const player = gameState.players[currentPlayerSetup];
    return React.createElement(StatAllocationScreen, {
      player, playerNumber: currentPlayerSetup + 1, totalPlayers: gameState.playerCount,
      onStatsAllocated: handleStatsAllocated
    });
  }

  if (gameState.step === 'play') {
    return React.createElement(TurnGameScreen, {
      gameState, setGameState, updateCurrentPlayer, updatePlayer, addPdvWithHistory,

// ============= ANOMALIE TAB =============
function AnomalieTab({ player, gameState, setGameState, updateCurrentPlayer }) {
  const [currentCard, setCurrentCard] = useState(null);
  const [isAnimating, setIsAnimating] = useState(false);

  const drawCard = () => {
    const availableCards = ANOMALIES.filter((_, index) => !gameState.drawnAnomalies.includes(index));
    if (availableCards.length === 0) return alert("Toutes les anomalies ont été tirées !");

    setIsAnimating(true);
    setCurrentCard(null);

    setTimeout(() => {
      const randomIndex = Math.floor(Math.random() * availableCards.length);
      const selectedCard = availableCards[randomIndex];
      const originalIndex = ANOMALIES.indexOf(selectedCard);

      setGameState({ ...gameState, drawnAnomalies: [...gameState.drawnAnomalies, originalIndex] });
      setCurrentCard(selectedCard);
      setIsAnimating(false);

      const effect = parseAnomaly(selectedCard);
      if (effect.type === 'heal') updateCurrentPlayer({ pvCurrent: Math.min(player.character.pvMax, player.pvCurrent + effect.amount) });
      else if (effect.type === 'damage') updateCurrentPlayer({ pvCurrent: Math.max(0, player.pvCurrent - effect.amount) });
      else if (effect.type === 'bless') updateCurrentPlayer({ effects: [...player.effects, { id: `effect_${Date.now()}`, type: 'BLESS', stat: effect.stat, delta: 2, name: `Bénédiction de ${effect.statName}`, createdAt: Date.now() }] });
      else if (effect.type === 'curse') updateCurrentPlayer({ effects: [...player.effects, { id: `effect_${Date.now()}`, type: 'CURSE', stat: effect.stat, delta: -2, name: `Malédiction de ${effect.statName}`, createdAt: Date.now() }] });
      else if (effect.type === 'gain') updateCurrentPlayer({ [effect.resource]: player[effect.resource] + effect.amount });
      else if (effect.type === 'lose') updateCurrentPlayer({ [effect.resource]: Math.max(0, player[effect.resource] - effect.amount) });
    }, 300);
  };

  const resetDeck = () => { if (confirm("Réinitialiser le deck d'anomalies ?")) { setGameState({ ...gameState, drawnAnomalies: [] }); setCurrentCard(null); } };

  return React.createElement("div", { className: "space-y-6" },
    React.createElement("div", { className: "text-center" },
      React.createElement("h3", { className: "text-2xl font-bold text-gray-800 mb-2" }, "Anomalies"),
      React.createElement("p", { className: "text-gray-600" }, "Cartes restantes: ", React.createElement("strong", null, `${ANOMALIES.length - gameState.drawnAnomalies.length}`), " / ", ANOMALIES.length)
    ),
    React.createElement("div", { className: `min-h-[200px] bg-gradient-to-r from-purple-600 to-purple-800 rounded-xl p-8 flex items-center justify-center transition-all ${isAnimating ? 'scale-95 opacity-50' : 'scale-100'}` },
      currentCard ? React.createElement("p", { className: "text-xl text-center text-white font-medium" }, currentCard) : React.createElement("p", { className: "text-gray-300 text-center italic" }, 'Cliquez sur "Tirer une anomalie"')
    ),
    React.createElement("div", { className: "grid grid-cols-2 gap-4" },
      React.createElement("button", { onClick: drawCard, disabled: isAnimating, className: "py-4 bg-purple-600 text-white rounded-xl font-semibold hover:bg-purple-700 transition-colors" }, "Tirer une anomalie"),
      React.createElement("button", { onClick: resetDeck, className: "py-4 bg-gray-600 text-white rounded-xl font-semibold hover:bg-gray-700 transition-colors" }, "Réinitialiser")
    )
  );
}

// ============= DE TAB =============
function DeTab({ player, gameState, updateCurrentPlayer }) {
  const [moveResult, setMoveResult] = useState(null);
  const [attackResult, setAttackResult] = useState(null);
  const [isAnimating, setIsAnimating] = useState(false);
  const [showStatChoice, setShowStatChoice] = useState(false);

  const canReroll = rulesEngine.canReroll(player);
  const hasResources = player.or > 0 || player.cuivre > 0 || player.argent > 0 || player.obsidienne > 0;

  const rollMoveDice = () => {
    setIsAnimating(true);
    setMoveResult(null);
    setTimeout(() => {
      const result = Math.floor(Math.random() * 10);
      setMoveResult(result);
      setIsAnimating(false);
    }, 800);
  };

  const rollAttackDice = () => {
    if (player.usedAttackDice) return alert("Vous avez déjà utilisé votre jet d'attaque ce tour !");
    setIsAnimating(true);
    setAttackResult(null);

    setTimeout(() => {
      const statIndex = Math.floor(Math.random() * STATISTIQUES.length);
      const stat = STATISTIQUES[statIndex];
      const statKey = STAT_MAPPING[stat];

      const diceRoll = Math.floor(Math.random() * 10);
      const baseStat = player.baseStats[statKey] || 0;
      const effectsBonus = player.effects.filter(e => e.stat === statKey).reduce((sum, e) => sum + e.delta, 0);
      const total = diceRoll + baseStat + effectsBonus + (gameState.eventBonus || 0);

      setAttackResult({ stat, statKey, diceRoll, baseStat, effectsBonus, eventBonus: gameState.eventBonus || 0, total, isCritical: diceRoll === 0 });
      updateCurrentPlayer({ usedAttackDice: true });
      setIsAnimating(false);
    }, 800);
  };

  const changeStat = (newStatKey, newStatName) => {
    if (!canReroll) return;
    if (!hasResources) return alert("Pas de ressources disponibles !");
    if (!attackResult) return;

    // Prendre une ressource aléatoire
    const resourceToTake = getRandomAvailableResource(player);
    if (!resourceToTake) return alert("Pas de ressources disponibles !");

    const resourceNames = { or: 'Or', cuivre: 'Cuivre', argent: 'Argent', obsidienne: 'Obsidienne' };

function BiomeTab({ player, gameState, updateCurrentPlayer, addPdvWithHistory, playerIndex }) {
  const [selectedBiome, setSelectedBiome] = useState(null);
  const [difficulty, setDifficulty] = useState(6);
  const [isNeutral, setIsNeutral] = useState(true);
  const [isRanged, setIsRanged] = useState(false);
  const [result, setResult] = useState(null);
  const [showSacrifice, setShowSacrifice] = useState(false);
  const [sacrifice, setSacrifice] = useState(0);

  const canRanged = rulesEngine.canAttackRanged(player);
  const canBuy = rulesEngine.canBuyTerritory(player);
  const canSac = rulesEngine.canSacrificePv(player);

  const buyTerritory = () => {
    if (!selectedBiome) return alert("Sélectionnez un biome !");
    const cost = isNeutral ? difficulty : 10;
    if (player.or < cost) return alert(`Or insuffisant ! (${cost} Or requis)`);
    
    const biomeResource = BIOMES[selectedBiome].resource;
    
    updateCurrentPlayer({ 
      or: player.or - cost,
      territories: [...(player.territories || []), { id: `t_${Date.now()}`, biome: selectedBiome }],
      [biomeResource]: player[biomeResource] + 1
    });
    if (isNeutral) addPdvWithHistory(playerIndex, 1, 'TERRITORY', { biome: BIOMES[selectedBiome].name, method: 'achat' });
    
    setResult({ success: true, bought: true, cost, isNeutral, resourceGained: biomeResource });
  };

  const startAttack = () => {
    if (!selectedBiome) return alert("Sélectionnez un biome !");
    if (player.usedAttackDice) return alert("Jet d'attaque déjà utilisé !");
    
    if (canSac) {
      setShowSacrifice(true);
      setSacrifice(0);
    } else {
      executeAttack(0);
    }
  };

  const executeAttack = (sac) => {
    const statIdx = Math.floor(Math.random() * STATISTIQUES.length);
    const statName = STATISTIQUES[statIdx];
    const statKey = STAT_MAPPING[statName];

    const diceRoll = Math.floor(Math.random() * 10);
    const isCritical = diceRoll === 0;
    const baseStat = player.baseStats[statKey] || 0;
    const effectsBonus = player.effects.filter(e => e.stat === statKey).reduce((sum, e) => sum + e.delta, 0);
    const { bonus: skillBonus } = rulesEngine.getAttackBonus(player, { type: 'TERRITORY', isNeutral, isRanged });
    const total = diceRoll + baseStat + effectsBonus + skillBonus + sac + (gameState.eventBonus || 0);
    const success = total >= difficulty || isCritical;

    let damage = 0;
    if (!success && !rulesEngine.avoidsCounter(player, { isRanged })) {
      damage = difficulty - total;
    }

    // Appliquer le sacrifice
    let newPv = player.pvCurrent - sac;
    
    // Soin sur succès (Homme-bête)
    let heal = 0;
    if (success) {
      heal = rulesEngine.getHealOnSuccess(player);
      if (heal > 0) newPv = Math.min(player.character.pvMax, newPv + heal);
    }

    const biomeResource = BIOMES[selectedBiome].resource;

    setResult({ biome: BIOMES[selectedBiome], stat: statName, diceRoll, baseStat, effectsBonus, skillBonus, sacrifice: sac, total, difficulty, success, damage, isRanged, isNeutral, isCritical, heal, resourceGained: success ? biomeResource : null });
    
    if (success) {
      // PDV seulement si territoire neutre
      if (isNeutral) addPdvWithHistory(playerIndex, 1, 'TERRITORY', { biome: BIOMES[selectedBiome].name, difficulty });
      updateCurrentPlayer({ 
        usedAttackDice: true, 
        territories: [...(player.territories || []), { id: `t_${Date.now()}`, biome: selectedBiome }],
        pvCurrent: Math.max(0, newPv),
        [biomeResource]: player[biomeResource] + 1
      });
    } else if (damage > 0) {
      updateCurrentPlayer({ usedAttackDice: true, pvCurrent: Math.max(0, newPv - damage) });
    } else {
      updateCurrentPlayer({ usedAttackDice: true, pvCurrent: Math.max(0, newPv) });
    }
    
    setShowSacrifice(false);
    setSacrifice(0);
  };

  if (showSacrifice) {
    return React.createElement("div", { className: "space-y-6" },
      React.createElement("h3", { className: "text-xl font-bold text-center text-gray-800" }, "🩸 Furie Sacrificielle"),
      React.createElement("p", { className: "text-center text-red-600" }, "Sacrifiez des PV pour augmenter votre jet"),
      React.createElement("div", { className: "text-center" },

  const canSac = rulesEngine.canSacrificePv(player);
  const opponents = gameState.players.filter((_, i) => i !== gameState.currentTurn);

    setTarget(idx);

      const s = STATISTIQUES[Math.floor(Math.random() * STATISTIQUES.length)];
      setStat({ name: s, key: STAT_MAPPING[s] });

    }

    setStat({ name, key });
    if (canSac) setMode('sacrifice'); else execute(target, key, name, 0);

    setMode('rolling');
    setTimeout(() => {
      const att = player;
      const def = gameState.players[tIdx];

      const attDice = Math.floor(Math.random() * 10);
      const defDice = Math.floor(Math.random() * 10);
      
      const attBase = att.baseStats[statKey] || 0;
      const attEff = att.effects.filter(e => e.stat === statKey).reduce((s, e) => s + e.delta, 0);

      if (pdvGain > 0) {
        addPdvWithHistory(gameState.currentTurn, 1, 'KILL', { target: def.playerName });
        if (pdvGain > 1) addPdvWithHistory(gameState.currentTurn, pdvGain - 1, 'BONUS', { reason: 'Kill maudit' });

          return React.createElement("button", { key: o.id, onClick: () => selectTarget(idx), className: `w-full p-4 bg-gray-50 border-2 ${curse ? 'border-purple-500' : 'border-gray-300'} rounded-lg hover:bg-gray-100 text-left` },
            React.createElement("div", { className: "flex justify-between items-center" },
              React.createElement("div", null, React.createElement("span", { className: "font-bold text-gray-800" }, o.playerName), curse && " 💀"),

// ============= SORTS TAB =============
function SortsTab({ player, gameState, updateCurrentPlayer, updatePlayer }) {
  const [selectedTarget, setSelectedTarget] = useState(null);
  const [selectedStat, setSelectedStat] = useState('endurance');
  const [blessType, setBlessType] = useState('BLESS');

  const canBless = rulesEngine.canBless(player) && player.blessAvailable;
  const canCurse = rulesEngine.canCurse(player) && player.curseAvailable;
  const totalResources = player.or + player.cuivre + player.argent + player.obsidienne;
  const opponents = gameState.players.filter((_, i) => i !== gameState.currentTurn);

  const applyBless = () => {
    if (totalResources < 2) return alert("Il faut 2 ressources !");
    
    // Déduire 2 ressources (priorité: or > cuivre > argent > obsidienne)
    let remaining = 2;
    const updates = {};
    for (const res of ['or', 'cuivre', 'argent', 'obsidienne']) {
      if (remaining > 0 && player[res] > 0) {
        const take = Math.min(remaining, player[res]);
        updates[res] = player[res] - take;
        remaining -= take;
      }
    }

    const targetIdx = selectedTarget === 'self' ? gameState.currentTurn : selectedTarget;
    const targetPlayer = gameState.players[targetIdx];
    const effect = { id: `effect_${Date.now()}`, type: 'BLESS', stat: selectedStat, delta: 2, name: `Bénédiction de ${STAT_NAMES[selectedStat]}`, createdAt: Date.now() };
    
    if (targetIdx === gameState.currentTurn) {
      updateCurrentPlayer({ ...updates, effects: [...player.effects, effect], blessAvailable: false });
    } else {
      updateCurrentPlayer({ ...updates, blessAvailable: false });
      updatePlayer(targetIdx, { effects: [...targetPlayer.effects, effect] });
    }
    
    alert(`✨ Bénédiction appliquée à ${targetPlayer.playerName} !`);
    setSelectedTarget(null);
  };

  const applyCurse = () => {
    if (player.pvCurrent <= 3) return alert("PV insuffisants ! (3 PV requis)");
    if (selectedTarget === null || selectedTarget === 'self') return alert("Sélectionnez un adversaire !");

    const targetPlayer = gameState.players[selectedTarget];
    const effect = { id: `effect_${Date.now()}`, type: 'CURSE', stat: selectedStat, delta: -2, name: `Malédiction de ${STAT_NAMES[selectedStat]}`, createdAt: Date.now() };
    
    updateCurrentPlayer({ pvCurrent: player.pvCurrent - 3, curseAvailable: false });
    updatePlayer(selectedTarget, { effects: [...targetPlayer.effects, effect] });
    
    alert(`💀 Malédiction appliquée à ${targetPlayer.playerName} !`);
    setSelectedTarget(null);
  };

  return React.createElement("div", { className: "space-y-6" },
    React.createElement("h3", { className: "text-2xl font-bold text-center text-gray-800" }, "🔮 Sorts & Capacités"),
    
    // Vicaire - Bénédiction
    player.characterKey === 'VICAIRE' && React.createElement("div", { className: "bg-green-50 border-2 border-green-300 rounded-xl p-4" },
      React.createElement("h4", { className: "font-bold text-green-800 mb-3" }, "✨ Bénédiction Rituelle"),
      React.createElement("p", { className: "text-sm text-green-700 mb-3" }, "Coût: 2 ressources | Recharge: Passage Départ"),
      !canBless ? React.createElement("p", { className: "text-orange-600 font-semibold" }, "⚠️ Déjà utilisée ce tour") : React.createElement("div", { className: "space-y-3" },
        React.createElement("div", null,
          React.createElement("label", { className: "text-sm font-semibold text-gray-700" }, "Cible:"),
          React.createElement("div", { className: "flex gap-2 flex-wrap mt-1" },
            React.createElement("button", { onClick: () => setSelectedTarget('self'), className: `px-3 py-1 rounded ${selectedTarget === 'self' ? 'bg-green-600 text-white' : 'bg-gray-200'}` }, "Moi-même"),
            opponents.map((o, i) => {
              const idx = gameState.players.findIndex(x => x.id === o.id);
              return React.createElement("button", { key: o.id, onClick: () => setSelectedTarget(idx), className: `px-3 py-1 rounded ${selectedTarget === idx ? 'bg-green-600 text-white' : 'bg-gray-200'}` }, o.playerName);
            })
          )
        ),
        React.createElement("div", null,
          React.createElement("label", { className: "text-sm font-semibold text-gray-700" }, "Statistique:"),
          React.createElement("select", { value: selectedStat, onChange: e => setSelectedStat(e.target.value), className: "w-full mt-1 px-3 py-2 border rounded" },
            Object.entries(STAT_NAMES).map(([k, n]) => React.createElement("option", { key: k, value: k }, n))
          )
        ),
        React.createElement("button", { onClick: applyBless, disabled: selectedTarget === null || totalResources < 2, className: `w-full py-2 rounded font-semibold ${selectedTarget !== null && totalResources >= 2 ? 'bg-green-600 text-white' : 'bg-gray-300 text-gray-500'}` }, `Appliquer (${totalResources} ressources)`)
      )
    ),
    
    // Hérétique - Malédiction
    player.characterKey === 'HERETIQUE' && React.createElement("div", { className: "bg-red-50 border-2 border-red-300 rounded-xl p-4" },
      React.createElement("h4", { className: "font-bold text-red-800 mb-3" }, "💀 Malédiction Sanglante"),
      React.createElement("p", { className: "text-sm text-red-700 mb-3" }, "Coût: 3 PV | Recharge: Passage Départ"),
      !canCurse ? React.createElement("p", { className: "text-orange-600 font-semibold" }, "⚠️ Déjà utilisée ce tour") : React.createElement("div", { className: "space-y-3" },

          )
        ),
        React.createElement("button", { onClick: applyCurse, disabled: selectedTarget === null || selectedTarget === 'self' || player.pvCurrent <= 3, className: `w-full py-2 rounded font-semibold ${selectedTarget !== null && selectedTarget !== 'self' && player.pvCurrent > 3 ? 'bg-red-600 text-white' : 'bg-gray-300 text-gray-500'}` }, `Maudire (-3 PV)`)

      React.createElement("div", { className: "space-y-2" },
        player.character.skills.map((skill, idx) => {

          let statusText = '';

      cuivre: territoryCount.FORET,

        React.createElement(ResBox, { icon: "🪙", label: "Or", val: player.or, k: "or" }),
        React.createElement(ResBox, { icon: "🌳", label: "Cuivre", val: player.cuivre, k: "cuivre" }),
        React.createElement(ResBox, { icon: "🏜️", label: "Argent", val: player.argent, k: "argent" }),
        React.createElement(ResBox, { icon: "⛰️", label: "Obsidienne", val: player.obsidienne, k: "obsidienne" }),
        React.createElement(ResBox, { icon: "🏆", label: "PDV", val: player.pdv, k: "pdv" }),
        React.createElement(ResBox, { icon: "🎲", label: "Tour", val: player.tourPlateau, k: "tourPlateau" })
      )
    ),
    (player.territories || []).length > 0 && React.createElement("div", null,
      React.createElement("h3", { className: "text-xl font-bold text-gray-800 mb-3" }, `🏰 Territoires (${player.territories.length})`),
      React.createElement("div", { className: "flex gap-2 flex-wrap" },
        player.territories.map(t => React.createElement("div", { key: t.id, className: `px-4 py-2 rounded-lg bg-gradient-to-br ${BIOMES[t.biome].color} text-white font-bold` },
          `${BIOMES[t.biome].emoji} ${BIOMES[t.biome].name.split(' ')[0]}`
        ))
      )
    ),
    React.createElement("div", { className: "bg-blue-50 rounded-xl p-4" },
      React.createElement("h3", { className: "text-lg font-bold text-gray-800 mb-3" }, "Capacités"),
      React.createElement("p", { className: "text-sm text-gray-600 mb-2" }, React.createElement("strong", null, "Rôle:"), ` ${player.character.role}`),
      React.createElement("p", { className: "text-sm text-gray-600 mb-4 italic" }, player.character.concept),
      React.createElement("div", { className: "space-y-2" },
        player.character.skills.map((skill, idx) => React.createElement("div", { key: idx, className: "text-sm text-gray-700 bg-white rounded p-2" }, `• ${skill}`))
      )
    )
  );
}

// ============= PDV HISTORY TAB =============
function PdvHistoryTab({ player, gameState }) {
  const history = player.pdvHistory || [];
  const totals = useMemo(() => {
    const sums = {};
    history.forEach(e => { sums[e.source] = (sums[e.source] || 0) + e.amount; });
    return sums;
  }, [history]);

  const ranking = useMemo(() => [...gameState.players].sort((a, b) => b.pdv - a.pdv), [gameState.players]);
  const totalPdv = gameState.players.reduce((sum, p) => sum + p.pdv, 0);
  const nextEventThreshold = Math.ceil((totalPdv + 1) / 10) * 10;

  return React.createElement("div", { className: "space-y-6" },
    React.createElement("div", { className: "text-center" },
      React.createElement("h3", { className: "text-2xl font-bold text-gray-800" }, "🏆 Points de Victoire"),
      React.createElement("div", { className: "text-5xl font-bold text-amber-500" }, player.pdv),
      React.createElement("div", { className: "bg-purple-100 rounded-lg p-3 mt-3" },
        React.createElement("div", { className: "text-sm text-purple-700" }, `Total tous joueurs: ${totalPdv} PDV`),
        React.createElement("div", { className: "text-xs text-purple-600 mt-1" }, `Prochain événement à ${nextEventThreshold} PDV total`)
      )
    ),
    React.createElement("div", { className: "bg-gray-50 rounded-xl p-4" },
      React.createElement("h4", { className: "font-bold text-gray-800 mb-3" }, "📊 Répartition"),
      React.createElement("div", { className: "grid grid-cols-2 md:grid-cols-4 gap-3" },
        Object.entries(PDV_SOURCES).map(([k, info]) => React.createElement("div", { key: k, className: "bg-white rounded-lg p-3 text-center shadow" },
          React.createElement("div", { className: "text-2xl" }, info.emoji),
          React.createElement("div", { className: `text-2xl font-bold ${info.color}` }, totals[k] || 0),
          React.createElement("div", { className: "text-xs text-gray-500" }, info.label)
        ))
      )
    ),
    history.length > 0 && React.createElement("div", null,
      React.createElement("h4", { className: "font-bold text-gray-800 mb-3" }, `📜 Historique (${history.length})`),
      React.createElement("div", { className: "space-y-2 max-h-60 overflow-auto" },
        [...history].reverse().map(e => {
          const info = PDV_SOURCES[e.source] || PDV_SOURCES.BONUS;
          return React.createElement("div", { key: e.id, className: "flex items-center gap-3 bg-gray-50 rounded-lg p-3" },
            React.createElement("span", { className: "text-2xl" }, info.emoji),
            React.createElement("div", { className: "flex-1" },
              React.createElement("span", { className: `font-bold ${info.color}` }, `+${e.amount} PDV`),
              React.createElement("span", { className: "text-gray-500 text-sm ml-2" }, info.label),
              e.details && Object.keys(e.details).length > 0 && React.createElement("div", { className: "text-xs text-gray-400" }, Object.values(e.details).join(' • '))
            )
          );
        })
      )
    ),
    React.createElement("div", { className: "bg-gradient-to-r from-purple-600 to-blue-600 rounded-xl p-4 text-white" },
      React.createElement("h4", { className: "font-bold mb-3" }, "🏅 Classement"),
      React.createElement("div", { className: "space-y-2" },
        ranking.map((p, i) => React.createElement("div", { key: p.id, className: `flex items-center gap-3 p-2 rounded-lg ${p.id === player.id ? 'bg-white bg-opacity-20' : ''}` },
          React.createElement("span", { className: `text-xl font-bold ${i === 0 ? 'text-yellow-300' : i === 1 ? 'text-gray-300' : i === 2 ? 'text-amber-400' : ''}` }, `#${i + 1}`),
          React.createElement("span", { className: "flex-1" }, p.playerName),
          React.createElement("span", { className: "text-xl font-bold" }, p.pdv)
        ))
      )
    )
  );
}

// ============= RENDER =============
createRoot(document.getElementById('root')).render(React.createElement(TurnBasedGameApp));
  </script>
</body>
